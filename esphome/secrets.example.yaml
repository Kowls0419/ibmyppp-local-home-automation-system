# Copy to secrets.yaml (git-ignored) and fill in.
# Generate API keys with the ESPHome dashboard ("New device") or:
#   python3 -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"

wifi_ssid: "your-ssid"
wifi_password: "your-wifi-password"

# kyles-esp32-a (light switch actuator)
api_key_a: "base64-32-byte-key"
ota_password_a: "change-me"
fallback_ap_password_a: "change-me"

# kyles-esp32-b (people counter)
api_key_b: "base64-32-byte-key"
ota_password_b: "change-me"

# kyles-esp32-airquality
api_key_airquality: "base64-32-byte-key"
ota_password_airquality: "change-me"

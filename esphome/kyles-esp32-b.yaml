esphome:
  name: kyles-esp32-b
  friendly_name: kyles-esp32-b

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
  encryption:
    key: !secret api_key_b

ota:
  - platform: esphome
    password: !secret ota_password_b

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

globals:
  - id: room_occupancy
    type: int
    initial_value: '0'
    restore_value: yes
  - id: system_locked
    type: bool
    initial_value: 'false'
  - id: is_entering
    type: bool
    initial_value: 'false'
  - id: is_exiting
    type: bool
    initial_value: 'false'
  - id: step_reached
    type: int
    initial_value: '0' 
    # 0: Idle, 1: First Sensor Hit, 2: Mid Sensor Hit

script:
  - id: reset_logic
    then:
      - globals.set: {id: is_entering, value: 'false'}
      - globals.set: {id: is_exiting, value: 'false'}
      - globals.set: {id: step_reached, value: '0'}

  - id: sequence_timeout
    mode: restart
    then:
      - delay: 3s
      - script.execute: reset_logic
      - logger.log: "Sequence timed out - Resetting to Idle"

binary_sensor:
  # SENSOR 1: OUTER (Hallway side)
  - platform: gpio
    pin: {number: GPIO32, mode: INPUT_PULLUP}
    id: beam_outer
    name: "Outer Beam"
    on_press:
      then:
        - if:
            condition: {lambda: 'return !id(system_locked);'}
            then:
              - script.execute: sequence_timeout
              # CASE A: Starting an entry
              - if:
                  condition: {lambda: 'return !id(is_entering) && !id(is_exiting);'}
                  then:
                    - globals.set: {id: is_entering, value: 'true'}
                    - globals.set: {id: step_reached, value: '1'}
                    - logger.log: "Entry Started (Outer Hit)"
              # CASE B: Finishing an exit (Must have come from Inner -> Mid)
              - if:
                  condition: {lambda: 'return id(is_exiting) && id(step_reached) == 2;'}
                  then:
                    - lambda: 'if (id(room_occupancy) > 0) id(room_occupancy)--;'
                    - logger.log: "EXIT CONFIRMED (Third Sensor Hit)"
                    - globals.set: {id: system_locked, value: 'true'}
                    - script.execute: reset_logic
                    - component.update: occupancy_sensor
                    - delay: 1.5s
                    - globals.set: {id: system_locked, value: 'false'}

  # SENSOR 2: MIDDLE
  - platform: gpio
    pin: {number: GPIO33, mode: INPUT_PULLUP}
    id: beam_mid
    name: "Middle Beam"
    on_press:
      then:
        - if:
            condition: {lambda: 'return id(step_reached) == 1;'}
            then: 
              - script.execute: sequence_timeout
              - globals.set: {id: step_reached, value: '2'}
              - logger.log: "Step 2: Mid Hit (In Transit)"

  # SENSOR 3: INNER (Room side)
  - platform: gpio
    pin: {number: GPIO18, mode: INPUT_PULLUP}
    id: beam_inner
    name: "Inner Beam"
    on_press:
      then:
        - if:
            condition: {lambda: 'return !id(system_locked);'}
            then:
              - script.execute: sequence_timeout
              # CASE A: Starting an exit
              - if:
                  condition: {lambda: 'return !id(is_entering) && !id(is_exiting);'}
                  then:
                    - globals.set: {id: is_exiting, value: 'true'}
                    - globals.set: {id: step_reached, value: '1'}
                    - logger.log: "Exit Started (Inner Hit)"
              # CASE B: Finishing an entry (Must have come from Outer -> Mid)
              - if:
                  condition: {lambda: 'return id(is_entering) && id(step_reached) == 2;'}
                  then:
                    - lambda: 'id(room_occupancy)++;'
                    - logger.log: "ENTRY CONFIRMED (Third Sensor Hit)"
                    - globals.set: {id: system_locked, value: 'true'}
                    - script.execute: reset_logic
                    - component.update: occupancy_sensor
                    - delay: 1.5s
                    - globals.set: {id: system_locked, value: 'false'}

sensor:
  - platform: template
    name: "Room Occupancy Count"
    id: occupancy_sensor
    lambda: 'return (float)id(room_occupancy);'
    update_interval: never
    unit_of_measurement: "ppl"
    accuracy_decimals: 0

button:
  - platform: template
    name: "Add Person Manually"
    icon: "mdi:plus"
    on_press:
      - lambda: 'id(room_occupancy)++;'
      - component.update: occupancy_sensor

  - platform: template
    name: "Subtract Person Manually"
    icon: "mdi:minus"
    on_press:
      - lambda: 'if (id(room_occupancy) > 0) id(room_occupancy)--;'
      - component.update: occupancy_sensor

  - platform: template
    name: "Reset Occupancy"
    icon: "mdi:refresh"
    on_press:
      - globals.set: {id: room_occupancy, value: '0'}
      - script.execute: reset_logic
      - component.update: occupancy_sensor